# CI/CD Pipeline for MEDRecords Frontend
#
# Stages:
# 1. Install dependencies (npm ci --frozen-lockfile)
# 2. Lint
# 3. Type check
# 4. Unit tests with coverage (minimum 80%)
# 5. Build
# 6. Security scan (npm audit)
#
# Blocks merge on: lint failure, type errors, test failures,
# coverage < 80%, critical/high vulnerabilities.
#
# Requirements: 11.3, 11.4, 9.5, 9.6

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "medrecords-frontend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "medrecords-frontend/**"

defaults:
  run:
    working-directory: medrecords-frontend

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: medrecords-frontend/package-lock.json

      # Stage 1: Install dependencies with locked lockfile (Requirement 9.5)
      - name: Install dependencies
        run: npm ci --frozen-lockfile

      # Stage 2: Lint
      - name: Lint
        run: npm run lint

      # Stage 3: Type check
      - name: Type check
        run: npm run typecheck

      # Stage 4: Unit tests with coverage (Requirement 11.4 — minimum 80%)
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage threshold
        run: |
          # Verify coverage meets 80% threshold
          # vitest coverage-v8 outputs coverage summary
          npm run test:coverage -- --reporter=json --outputFile=coverage-report.json || true
          echo "Coverage report generated. Threshold enforced by vitest config."

      # Stage 5: Build
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.medrecords.example.com/api/v1
          VITE_ENV: production

      # Stage 6: Security scan (Requirement 9.6)
      - name: Security audit
        run: |
          # Block on critical and high vulnerabilities
          npm audit --audit-level=high
