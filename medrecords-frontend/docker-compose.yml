# docker-compose.yml for MEDRecords frontend local development.
#
# Usage:
#   docker-compose up --build    # Build and start the frontend
#   docker-compose down          # Stop and remove containers
#
# Requirements: 11.5

version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
      - VITE_ENV=${VITE_ENV:-development}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
