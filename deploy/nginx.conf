##
# nginx configuration for MEDRecords frontend.
#
# Security headers:
# - Content-Security-Policy: scripts restricted to self-origin
# - X-Frame-Options: SAMEORIGIN
# - X-Content-Type-Options: nosniff
# - Referrer-Policy: strict-origin-when-cross-origin
#
# Performance:
# - gzip compression level 6 for text/plain, text/css, application/json, application/javascript
# - Cache-Control immutable for hashed static assets
#
# Requirements: 9.1, 9.7, 11.6, 11.7
##

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # -------------------------------------------------------------------------
    # Gzip compression - level 6 for specified content types
    # Requirement: 11.6
    # -------------------------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_vary on;
    gzip_min_length 256;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------
        # Security headers
        # Requirements: 9.1, 9.7
        # ---------------------------------------------------------------------
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---------------------------------------------------------------------
        # Hashed static assets - immutable caching
        # Requirement: 11.7
        # ---------------------------------------------------------------------
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }

        # ---------------------------------------------------------------------
        # API reverse proxy — forwards /api/ to the backend (gunicorn on
        # 127.0.0.1:8006). This keeps the API same-origin with the frontend so
        # no CORS is required, and the browser never talks to the backend port
        # directly (it only listens on loopback).
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:8006;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # ---------------------------------------------------------------------
        # Health check endpoint
        # Requirement: 11.2
        # ---------------------------------------------------------------------
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # ---------------------------------------------------------------------
        # SPA fallback - serve index.html for client-side routing
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
